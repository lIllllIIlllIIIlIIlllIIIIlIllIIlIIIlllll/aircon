<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: white;
      margin-top: 50px;
    }
    h1 {
      margin-bottom: 20px;
    }
    #ac-container {
      position: relative;
      display: inline-block;
    }
    #ac-image {
      width: 300px;
    }
    .wind {
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    .wind div {
      width: 10px;
      height: 40px;
      background: rgba(135, 206, 250, 0.6);
      animation: blow 1s infinite;
      border-radius: 5px;
    }
    .wind div:nth-child(2) {
      animation-delay: 0.2s;
    }
    .wind div:nth-child(3) {
      animation-delay: 0.4s;
    }
    @keyframes blow {
      0% {
        opacity: 0;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(10px);
      }
      100% {
        opacity: 0;
        transform: translateY(20px);
      }
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 1em;
      background-color: #262626;
      color: white;
      border: none;
      border-radius: 0px;
      cursor: pointer;
    }
    #temp-display {
      margin-top: 15px;
      font-size: 1.5em;
    }
    #temp-control {
      margin-top: 20px;
    }
    #temp-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
    }
    #temp-buttons button {
      width: 40px;
      height: 40px;
      font-size: 1.5em;
    }
  </style>
</head>
<body>
  <div id="ac-container">
    <img id="ac-image" src="https://i.postimg.cc/t40NVhRx/MPdfefh.png">
    <div class="wind" id="wind" style="display: none;">
      <div></div><div></div><div></div>
    </div>
  </div>

  <div>
    <button onclick="toggleAC()">on / off</button>
  </div>

  <div id="temp-control">
    <div id="temp-display">24°C</div>
    <div id="temp-buttons">
      <button onclick="changeTemp(-1)">-</button>
      <button onclick="changeTemp(1)">+</button>
    </div>
  </div>

  <script>
    let isOn = false
    let temperature = 24

    let toggleAC = () => {
      isOn = !isOn
      const wind = document.getElementById('wind')

      if (isOn) {
        wind.style.display = 'flex'
      }
      else {
        wind.style.display = 'none'
      }
    }

    let changeTemp = delta => {
      const display = document.getElementById('temp-display')
      const newTemp = temperature + delta

      if (newTemp >= -171 && newTemp <= 30) {
        temperature = newTemp
        display.textContent = `${temperature}°C`
      }
    }
  </script>
</body>
</html>
